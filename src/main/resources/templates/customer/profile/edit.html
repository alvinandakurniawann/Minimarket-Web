<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Profil - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064E3B;
            --accent: #EA580C;
            --bg: #ECFDF5;
            --ink: #064E3B;
            --muted: #475569;
            --card: #FFFFFF;
            --border: #A7F3D0;
        }
        body {
            font-family: 'Nunito Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
        }
        h1, .display { font-family: 'Rubik', 'Nunito Sans', sans-serif; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .field label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .field input, .field select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background-color: #fff;
            color: var(--ink);
            font-size: 15px;
            font-weight: 600;
        }
        .field input:focus, .field select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
        }
        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline {
            border: 2px solid var(--border);
            color: var(--ink);
            font-weight: 700;
            transition: border-color 0.2s ease;
        }
        .btn-outline:hover { border-color: var(--primary); }
    </style>
</head>
<body>
    <header class="bg-white shadow sticky top-0 z-50 border-b-2" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="/customer/home" class="text-xl font-extrabold flex items-center gap-2" style="color: var(--primary-dark);">
                <i class="fas fa-store" style="color: var(--primary);"></i>
                MINIMARKET
            </a>
            <a href="/customer/profile/view" class="font-bold text-sm" style="color: var(--primary-dark);">
                <i class="fas fa-arrow-left mr-2"></i>Profil
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-xl">
        <p class="text-sm font-bold tracking-widest uppercase mb-2" style="color: var(--primary);">Akun Saya</p>
        <h1 class="display text-3xl font-extrabold mb-6">Ubah Profil</h1>

        <form action="/customer/profile/update" method="post" class="bg-white rounded-2xl p-6 flex flex-col gap-4" style="border: 2px solid var(--border);">
            <div class="field">
                <label for="fullName">Nama Lengkap</label>
                <input type="text" id="fullName" name="fullName" th:value="${customer.fullName}" required>
            </div>
            <div class="field">
                <label for="address">Alamat</label>
                <input type="text" id="address" name="address" th:value="${customer.address}" required>
            </div>
            <div class="field">
                <label for="gender">Jenis Kelamin</label>
                <select id="gender" name="gender" required>
                    <option value="Male" th:selected="${customer.gender == 'Male'}">Laki-laki</option>
                    <option value="Female" th:selected="${customer.gender == 'Female'}">Perempuan</option>
                </select>
            </div>
            <div class="field">
                <label for="phone">Nomor Telepon</label>
                <input type="text" id="phone" name="phone" th:value="${customer.phone}" required>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary flex-1 px-5 py-2.5 rounded-xl">Simpan</button>
                <a href="/customer/profile/view" class="btn-outline px-5 py-2.5 rounded-xl">Batal</a>
            </div>
        </form>
    </main>

    <footer class="text-center text-sm py-6 font-semibold" style="color: var(--muted);">
        Minimarket &middot; Belanja online kebutuhan harian
    </footer>
</body>
</html>
