<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064E3B;
            --accent: #EA580C;
            --bg: #ECFDF5;
            --ink: #064E3B;
            --muted: #475569;
            --card: #FFFFFF;
            --border: #A7F3D0;
        }
        body {
            font-family: 'Nunito Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
        }
        h1, .display { font-family: 'Rubik', 'Nunito Sans', sans-serif; }
        .mono { font-family: ui-monospace, monospace; }
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .panel {
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
        }
        .tx-table { width: 100%; border-collapse: collapse; }
        .tx-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
        }
        .tx-table td {
            padding: 12px;
            border-bottom: 1px solid #E2E8F0;
            vertical-align: middle;
        }
        .tx-table tbody tr:last-child td { border-bottom: none; }
        .tx-table tbody tr:hover { background-color: #F8FAFC; }
        .status-pill {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }
        .st-success { color: #047857; background-color: #D1FAE5; }
        .st-failed { color: #B91C1C; background-color: #FEE2E2; }
        .st-pending { color: #92400E; background-color: #FEF3C7; }
        .link-detail { color: var(--primary); font-weight: 700; }
        .link-detail:hover { text-decoration: underline; }
        .empty-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <header class="bg-white shadow sticky top-0 z-50 border-b-2" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="/customer/home" class="text-xl font-extrabold flex items-center gap-2" style="color: var(--primary-dark);">
                <i class="fas fa-store" style="color: var(--primary);"></i>
                MINIMARKET
            </a>
            <a href="/customer/home" class="font-bold text-sm" style="color: var(--primary-dark);">
                <i class="fas fa-home mr-2"></i>Beranda
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <nav class="text-sm font-semibold mb-4" aria-label="Breadcrumb">
            <a href="/customer/home" class="hover:underline" style="color: var(--primary);">Home</a>
            <span class="mx-2" style="color: var(--muted);">/</span>
            <span style="color: var(--muted);">Riwayat Transaksi</span>
        </nav>

        <p class="text-sm font-bold tracking-widest uppercase mb-2" style="color: var(--primary);">Pesanan Saya</p>
        <h1 class="display text-3xl md:text-4xl font-extrabold mb-6">Riwayat Transaksi</h1>

        <div class="panel p-4 md:p-6 overflow-x-auto">
            <table class="tx-table" th:if="${transactions != null and !transactions.isEmpty()}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Total</th>
                        <th>Pembayaran</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td class="mono" th:text="${transaction.id}">20</td>
                        <td class="mono font-bold" th:text="'Rp ' + ${#numbers.formatDecimal(transaction.total, 1, 'POINT', 0, 'COMMA')}">Rp 19.000</td>
                        <td th:text="${transaction.paymentMethod}">QRIS</td>
                        <td class="mono text-sm" th:text="${transaction.formattedCreatedAt}">2025-01-02</td>
                        <td>
                            <span class="status-pill" th:classappend="${transaction.status == 'Transaksi Berhasil'} ? ' st-success' : (${transaction.status == 'Transaksi Gagal'} ? ' st-failed' : ' st-pending')" th:text="${transaction.status}">Pending</span>
                        </td>
                        <td>
                            <a th:href="'/transactions/' + ${transaction.id}" class="link-detail text-sm">Lihat <i class="fas fa-arrow-right ml-1"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-box" th:if="${transactions == null or transactions.isEmpty()}">
                <i class="fas fa-receipt text-4xl mb-3" style="color: var(--border);"></i>
                <p class="font-bold">Belum ada transaksi.</p>
                <p class="text-sm mb-4">Yuk mulai belanja kebutuhan harianmu.</p>
                <a href="/customer/home" class="font-bold hover:underline" style="color: var(--primary);">Kembali belanja →</a>
            </div>
        </div>
    </main>

    <footer class="text-center text-sm py-6 font-semibold" style="color: var(--muted);">
        Minimarket &middot; Belanja online kebutuhan harian
    </footer>
</body>
</html>
