<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Diterima - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064E3B;
            --accent: #EA580C;
            --bg: #ECFDF5;
            --ink: #064E3B;
            --muted: #475569;
            --card: #FFFFFF;
            --border: #A7F3D0;
        }
        body {
            font-family: 'Nunito Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
        }
        h1, .display { font-family: 'Rubik', 'Nunito Sans', sans-serif; }
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .ok-badge {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            background-color: var(--primary);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline {
            border: 2px solid var(--border);
            color: var(--ink);
            font-weight: 700;
            transition: border-color 0.2s ease;
        }
        .btn-outline:hover { border-color: var(--primary); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
    <div class="text-center panel bg-white p-8 md:p-10 rounded-2xl shadow-lg w-full max-w-lg" style="border: 2px solid var(--border);">
        <div class="ok-badge"><i class="fas fa-check"></i></div>
        <h1 class="display text-3xl md:text-4xl font-extrabold mb-3">Pesanan Diterima</h1>
        <p th:text="${paymentInstruction}" class="text-base mb-6" style="color: var(--muted);">
            Instruksi Pembayaran
        </p>
        <img th:if="${qrisImage}" th:src="${qrisImage}" alt="QRIS Pembayaran" class="max-w-xs mx-auto mb-6 rounded-xl border" style="border-color: var(--border);">
        <div class="flex gap-3 justify-center flex-wrap">
            <a th:href="'/transactions/' + ${transaction.id}" class="btn-primary px-5 py-2.5 rounded-xl">
                <i class="fas fa-receipt mr-2"></i>Lihat Transaksi Saya
            </a>
            <a href="/customer/home" class="btn-outline px-5 py-2.5 rounded-xl">
                <i class="fas fa-home mr-2"></i>Kembali ke Beranda
            </a>
        </div>
    </div>
</body>
</html>
