<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori - Admin Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --card: #1B2336;
            --border: #475569;
            --fg: #F8FAFC;
            --muted-fg: #CBD5E1;
            --accent: #22C55E;
            --accent-ink: #052E16;
            --danger: #DC2626;
        }
        body {
            font-family: 'Fira Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
        }
        .mono { font-family: 'Fira Code', monospace; }
        a:focus-visible, button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .panel {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .admin-table thead th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted-fg);
        }
        .admin-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .btn-primary {
            background-color: var(--accent);
            color: var(--accent-ink);
            font-weight: 700;
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-edit {
            border: 1px solid var(--border);
            color: var(--fg);
            transition: border-color 0.2s ease;
        }
        .btn-edit:hover { border-color: var(--accent); }
        .btn-danger {
            background-color: var(--danger);
            color: #fff;
            transition: filter 0.2s ease;
        }
        .btn-danger:hover { filter: brightness(1.15); }
        @media (prefers-reduced-motion: reduce) {
            .btn-primary { transition: none; }
            .btn-primary:hover { transform: none; }
        }
    </style>
</head>
<body>
    <nav class="border-b" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/admin/dashboard" class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-store" style="color: var(--accent);"></i>
                <span>Minimarket <span class="mono text-sm font-medium px-2 py-1 rounded" style="background-color: var(--card); color: var(--accent);">ADMIN</span></span>
            </a>
            <a class="font-semibold text-sm hover:underline flex items-center" style="color: var(--muted-fg);" href="/auth/logout">
                <i class="fas fa-sign-out-alt mr-2"></i> LOG OUT
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <nav class="text-sm font-semibold mb-4" aria-label="Breadcrumb">
            <a href="/admin/dashboard" class="hover:underline" style="color: var(--accent);">Dashboard</a>
            <span class="mx-2" style="color: var(--muted-fg);">/</span>
            <span style="color: var(--muted-fg);">Kategori</span>
        </nav>

        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div>
                <p class="mono text-sm font-semibold tracking-widest uppercase mb-2" style="color: var(--accent);">Katalog</p>
                <h1 class="text-3xl md:text-4xl font-bold">Kategori</h1>
            </div>
            <a href="/admin/category/add" class="btn-primary px-5 py-2.5 rounded-lg text-sm">
                <i class="fas fa-plus mr-2"></i>Tambah Kategori
            </a>
        </div>

        <div class="panel p-4 md:p-6 overflow-x-auto">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Kategori</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="category : ${categories}">
                        <td class="mono" th:text="${category.id}">1</td>
                        <td class="font-semibold" th:text="${category.name}">Sample Category</td>
                        <td>
                            <div class="flex gap-2">
                                <a th:href="'/admin/category/edit/' + ${category.id}" class="btn-edit px-3 py-1.5 rounded-lg text-sm font-bold inline-flex items-center" aria-label="Ubah kategori">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="'/admin/category/delete/' + ${category.id}" method="post" class="inline" onsubmit="return confirm('Hapus kategori ini?');">
                                    <button type="submit" class="btn-danger px-3 py-1.5 rounded-lg text-sm font-bold inline-flex items-center" aria-label="Hapus kategori">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="text-center text-sm py-6" style="color: var(--muted-fg);">
        Minimarket Admin &middot; Panel pengelolaan toko
    </footer>
</body>
</html>
