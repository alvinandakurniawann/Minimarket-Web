<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Kategori - Admin Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --card: #1B2336;
            --border: #475569;
            --fg: #F8FAFC;
            --muted-fg: #CBD5E1;
            --accent: #22C55E;
            --accent-ink: #052E16;
        }
        body {
            font-family: 'Fira Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
        }
        .mono { font-family: 'Fira Code', monospace; }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .panel {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .field label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--fg);
            font-size: 15px;
        }
        .field input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
        }
        .btn-primary {
            background-color: var(--accent);
            color: var(--accent-ink);
            font-weight: 700;
            transition: filter 0.2s ease;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-ghost {
            border: 1px solid var(--border);
            color: var(--fg);
            font-weight: 700;
            transition: border-color 0.2s ease;
        }
        .btn-ghost:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <nav class="border-b" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/admin/dashboard" class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-store" style="color: var(--accent);"></i>
                <span>Minimarket <span class="mono text-sm font-medium px-2 py-1 rounded" style="background-color: var(--card); color: var(--accent);">ADMIN</span></span>
            </a>
            <a class="font-semibold text-sm hover:underline flex items-center" style="color: var(--muted-fg);" href="/auth/logout">
                <i class="fas fa-sign-out-alt mr-2"></i> LOG OUT
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <nav class="text-sm font-semibold mb-4" aria-label="Breadcrumb">
            <a href="/admin/dashboard" class="hover:underline" style="color: var(--accent);">Dashboard</a>
            <span class="mx-2" style="color: var(--muted-fg);">/</span>
            <a href="/admin/category/list" class="hover:underline" style="color: var(--accent);">Kategori</a>
            <span class="mx-2" style="color: var(--muted-fg);">/</span>
            <span style="color: var(--muted-fg);">Tambah</span>
        </nav>

        <p class="mono text-sm font-semibold tracking-widest uppercase mb-2" style="color: var(--accent);">Katalog</p>
        <h1 class="text-3xl md:text-4xl font-bold mb-6">Tambah Kategori</h1>

        <form method="post" action="/admin/category/add" class="panel p-6 flex flex-col gap-4">
            <div class="field">
                <label for="name">Nama Kategori</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary flex-1 px-5 py-2.5 rounded-lg">Simpan Kategori</button>
                <a href="/admin/category/list" class="btn-ghost px-5 py-2.5 rounded-lg">Batal</a>
            </div>
        </form>
    </main>

    <footer class="text-center text-sm py-6" style="color: var(--muted-fg);">
        Minimarket Admin &middot; Panel pengelolaan toko
    </footer>
</body>
</html>
