<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Transaksi - Admin Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --card: #1B2336;
            --border: #475569;
            --fg: #F8FAFC;
            --muted-fg: #CBD5E1;
            --accent: #22C55E;
            --accent-ink: #052E16;
        }
        body {
            font-family: 'Fira Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
        }
        .mono { font-family: 'Fira Code', monospace; }
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .panel {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .admin-table thead th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted-fg);
        }
        .admin-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .status-pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid;
            white-space: nowrap;
        }
        .st-pending { color: #FBBF24; border-color: #F59E0B; background-color: rgba(245, 158, 11, 0.12); }
        .st-success { color: #22C55E; border-color: #22C55E; background-color: rgba(34, 197, 94, 0.12); }
        .st-failed { color: #F87171; border-color: #DC2626; background-color: rgba(220, 38, 38, 0.12); }
        .btn-view {
            border: 1px solid var(--border);
            color: var(--fg);
            transition: border-color 0.2s ease;
        }
        .btn-view:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <nav class="border-b" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/admin/dashboard" class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-store" style="color: var(--accent);"></i>
                <span>Minimarket <span class="mono text-sm font-medium px-2 py-1 rounded" style="background-color: var(--card); color: var(--accent);">ADMIN</span></span>
            </a>
            <a class="font-semibold text-sm hover:underline flex items-center" style="color: var(--muted-fg);" href="/auth/logout">
                <i class="fas fa-sign-out-alt mr-2"></i> LOG OUT
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <nav class="text-sm font-semibold mb-4" aria-label="Breadcrumb">
            <a href="/admin/dashboard" class="hover:underline" style="color: var(--accent);">Dashboard</a>
            <span class="mx-2" style="color: var(--muted-fg);">/</span>
            <span style="color: var(--muted-fg);">Transaksi</span>
        </nav>

        <p class="mono text-sm font-semibold tracking-widest uppercase mb-2" style="color: var(--accent);">Penjualan</p>
        <h1 class="text-3xl md:text-4xl font-bold mb-6">Transaksi</h1>

        <div class="panel p-4 md:p-6 overflow-x-auto">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Pelanggan</th>
                        <th>Total</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td class="mono" th:text="${transaction.id}">1</td>
                        <td class="font-semibold" th:text="${transaction.customerName}">John Doe</td>
                        <td class="mono" th:text="'Rp ' + ${#numbers.formatDecimal(transaction.total, 1, 'POINT', 0, 'COMMA')}">Rp 200.000</td>
                        <td class="mono text-sm" th:text="${transaction.formattedCreatedAt}">2024-12-30</td>
                        <td>
                            <span class="status-pill" th:classappend="${transaction.status == 'Transaksi Berhasil'} ? ' st-success' : (${transaction.status == 'Transaksi Gagal'} ? ' st-failed' : ' st-pending')" th:text="${transaction.status}">Pending</span>
                        </td>
                        <td>
                            <a th:href="'/admin/transactions/detail/' + ${transaction.id}" class="btn-view px-3 py-1.5 rounded-lg text-sm font-bold inline-flex items-center gap-2">
                                <i class="fas fa-eye"></i>Detail
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="text-center text-sm py-6" style="color: var(--muted-fg);">
        Minimarket Admin &middot; Panel pengelolaan toko
    </footer>
</body>
</html>
