<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terjadi Kesalahan - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064E3B;
            --accent: #EA580C;
            --bg: #ECFDF5;
            --ink: #064E3B;
            --muted: #475569;
            --card: #FFFFFF;
            --border: #A7F3D0;
        }
        body {
            font-family: 'Nunito Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
        }
        h1, .display { font-family: 'Rubik', 'Nunito Sans', sans-serif; }
        .mono { font-family: ui-monospace, monospace; }
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .code-badge {
            display: inline-block;
            font-family: ui-monospace, monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-dark);
            background-color: #D1FAE5;
            border-radius: 999px;
            padding: 4px 16px;
            margin-bottom: 12px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline {
            border: 2px solid var(--border);
            color: var(--ink);
            font-weight: 700;
            transition: border-color 0.2s ease;
        }
        .btn-outline:hover { border-color: var(--primary); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
    <div class="text-center bg-white p-8 md:p-12 rounded-2xl max-w-lg w-full" style="border: 2px solid var(--border);">
        <div class="mx-auto mb-4 flex items-center justify-center rounded-full" style="width: 72px; height: 72px; background-color: #FEE2E2; color: #DC2626; font-size: 30px;">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <span class="code-badge" th:text="'Error ' + ${status}">Error 404</span>
        <h1 class="display text-3xl md:text-4xl font-extrabold mb-3" th:text="${status == 404} ? 'Halaman Tidak Ditemukan' : 'Terjadi Kesalahan'">Halaman Tidak Ditemukan</h1>
        <p class="mb-2" style="color: var(--muted);" th:text="${status == 404} ? 'Alamat yang Anda tuju tidak tersedia atau sudah dipindahkan.' : 'Maaf, sesuatu tidak beres di sisi kami. Silakan coba lagi.'">
            Alamat yang Anda tuju tidak tersedia atau sudah dipindahkan.
        </p>
        <p class="mono text-xs mb-6" style="color: var(--muted);" th:text="${path}">/</p>
        <div class="flex gap-3 justify-center flex-wrap">
            <a href="/customer/home" class="btn-primary px-6 py-2.5 rounded-xl">
                <i class="fas fa-home mr-2"></i>Kembali ke Beranda
            </a>
            <button type="button" class="btn-outline px-6 py-2.5 rounded-xl" onclick="history.back()">Kembali</button>
        </div>
    </div>
</body>
</html>
