<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064E3B;
            --accent: #EA580C;
            --bg: #ECFDF5;
            --ink: #064E3B;
            --muted: #475569;
            --card: #FFFFFF;
            --border: #A7F3D0;
        }
        body {
            font-family: 'Nunito Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
        }
        h1, .display { font-family: 'Rubik', 'Nunito Sans', sans-serif; }
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        .field-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background-color: #F8FAFC;
        }
        .field-row i { color: var(--primary); width: 20px; text-align: center; }
        .field-row span { font-weight: 600; }
        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline {
            border: 2px solid var(--border);
            color: var(--ink);
            font-weight: 700;
            transition: border-color 0.2s ease;
        }
        .btn-outline:hover { border-color: var(--primary); }
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            background-color: var(--primary);
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-family: 'Rubik', sans-serif;
        }
    </style>
</head>
<body>
    <header class="bg-white shadow sticky top-0 z-50 border-b-2" style="border-color: var(--border);">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="/customer/home" class="text-xl font-extrabold flex items-center gap-2" style="color: var(--primary-dark);">
                <i class="fas fa-store" style="color: var(--primary);"></i>
                MINIMARKET
            </a>
            <a href="/customer/home" class="font-bold text-sm" style="color: var(--primary-dark);">
                <i class="fas fa-home mr-2"></i>Beranda
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-xl">
        <div class="bg-white rounded-2xl p-6 md:p-8" style="border: 2px solid var(--border);">
            <div class="avatar" th:text="${#strings.substring(customer.fullName, 0, 1)}">A</div>
            <h1 class="display text-2xl font-extrabold text-center mb-1" th:text="${customer.fullName}">Nama Lengkap</h1>
            <p class="text-center text-sm mb-6" style="color: var(--muted);" th:text="${customer.email}">email@example.com</p>

            <div class="flex flex-col gap-3 mb-6">
                <div class="field-row">
                    <i class="fas fa-map-marker-alt"></i>
                    <div><div class="text-xs font-bold uppercase tracking-wider" style="color: var(--muted);">Alamat</div><span th:text="${customer.address}">-</span></div>
                </div>
                <div class="field-row">
                    <i class="fas fa-venus-mars"></i>
                    <div><div class="text-xs font-bold uppercase tracking-wider" style="color: var(--muted);">Jenis Kelamin</div><span th:text="${customer.gender}">-</span></div>
                </div>
                <div class="field-row">
                    <i class="fas fa-phone"></i>
                    <div><div class="text-xs font-bold uppercase tracking-wider" style="color: var(--muted);">Nomor Telepon</div><span th:text="${customer.phone}">-</span></div>
                </div>
            </div>

            <div class="flex gap-3">
                <a href="/customer/profile/edit" class="btn-primary flex-1 text-center px-4 py-2.5 rounded-xl">
                    <i class="fas fa-edit mr-2"></i>Edit Profil
                </a>
                <a href="/customer/home" class="btn-outline px-4 py-2.5 rounded-xl">
                    <i class="fas fa-home mr-2"></i>Beranda
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center text-sm py-6 font-semibold" style="color: var(--muted);">
        Minimarket &middot; Belanja online kebutuhan harian
    </footer>
</body>
</html>
