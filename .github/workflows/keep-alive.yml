# Monitor backend + cegah Supabase pause 7 hari (tier gratis).
# Isi Secrets di GitHub repo > Settings > Secrets and variables > Actions:
#   BACKEND_URL       : mis. https://minimarket.azurewebsites.net (tanpa slash akhir)
#   SUPABASE_URL      : mis. https://xyzcompany.supabase.co
#   SUPABASE_ANON_KEY : anon/public key dari Supabase dashboard
name: keep-alive


on:
  schedule:
    - cron: "*/10 * * * *" # tiap 10 menit -> backend (Azure idle ~20 mnt) + Supabase (cegah pause 7 hari)
  workflow_dispatch:


jobs:
  ping-backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: curl -fsSL "${BACKEND_URL%/}/auth/login" > /dev/null
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}


  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      # WAJIB query PostgREST (kena Postgres), bukan /auth/v1/health yg tidak dihitung sebagai aktivitas DB.
      - run: 'curl -fsS -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/product?select=id&limit=1" > /dev/null'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
