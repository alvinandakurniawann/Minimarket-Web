# Monitor backend + cegah Supabase pause 7 hari (tier gratis).
# Isi Secrets di GitHub repo > Settings > Secrets and variables > Actions:
#   BACKEND_URL       : mis. https://minimarket.azurewebsites.net (tanpa slash akhir)
#   SUPABASE_URL      : mis. https://xyzcompany.supabase.co
#   SUPABASE_ANON_KEY : anon/public key dari Supabase dashboard
name: keep-alive

on:
  schedule:
    - cron: "*/30 * * * *" # tiap 30 menit -> backend
    - cron: "0 3 */5 * *" # tiap 5 hari jam 03:00 UTC -> Supabase
  workflow_dispatch:

jobs:
  ping-backend:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "$BACKEND_URL/"
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

  ping-supabase:
    if: github.event.schedule == '0 3 */5 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: 'curl -fsS -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
